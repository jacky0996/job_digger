version: '3.8'

services:
  scraper-api:
    build:
      context: ./scraper_api
      dockerfile: Dockerfile
    container_name: job_digger_api
    ports:
      # FastAPI 對外開放 8000
      - "8000:8000"
    environment:
      # 為了讓 Python 的 print 能即時顯示在 docker logs 中
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    
