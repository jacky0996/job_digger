version: '3.8'

services:
  scraper-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: job-digger-api:local
    container_name: job_digger_api
    ports:
      # FastAPI 對外開放 host:85 → container:8000
      # (admin 後台與本機開發者用,正式環境建議改 expose: 8000 不對外)
      - "85:8000"
    env_file:
      - .env
    environment:
      # 即時顯示 Python print 到 docker logs
      - PYTHONUNBUFFERED=1
      # DB 連線:從容器內走 service name(同 compose network)
      - DB_HOST=job_db
      - DB_PORT=3306
      # CORS 白名單:允許 admin 後台
      # (admin 用 8084 而非 84 — 84 被 macOS / Docker Desktop reserve)
      - ALLOWED_ORIGINS=http://localhost:8084,http://127.0.0.1:8084
      # 容器內無 X server,Playwright 必須 headless,否則 chromium 一 launch 就 crash
      - BROWSER_HEADLESS=true
      # 容器只裝 bundled Chromium (沒裝 Google Chrome),不能用 channel="chrome"
      - USE_REAL_CHROME=false
    depends_on:
      - job_db
    restart: unless-stopped
  job_db:
    image: mariadb:latest
    container_name: job_digger_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - ./db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
