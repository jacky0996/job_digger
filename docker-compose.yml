version: '3.8'

services:
  scraper-api:
    build:
      context: ./scraper_api
      dockerfile: Dockerfile
    container_name: job_digger_api
    ports:
      # FastAPI 對外開放 8000
      - "8000:8000"
    environment:
      # 為了讓 Python 的 print 能即時顯示在 docker logs 中
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  job_db:
    image: mariadb:latest
    container_name: job_digger_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - ./db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
