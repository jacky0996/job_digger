# Cloud Build pipeline for job-digger (FastAPI scraper) → Cloud Run
#
# 觸發來源:Cloud Run continuous deployment (GitHub push to master)
# 編譯目標:Dockerfile.cloudrun (Python 3.11 + Playwright Chromium)
# 部署目標:Cloud Run service `job-digger` @ asia-east1
#
# Cloud Run service 需另外手動設:
#   - env vars: DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME,
#               GOOGLE_GENAI_USE_VERTEXAI, GOOGLE_CLOUD_PROJECT, GOOGLE_CLOUD_LOCATION,
#               ALLOWED_ORIGINS
#   - secrets: DB_PASSWORD → jobdigger-db-password
#   - Cloud SQL connection: middleplatform-496708:asia-east1:portfolio
#   - runtime SA grant: roles/aiplatform.user (給 Vertex AI 用)
#   - image 含 Chromium 較肥,memory 建議 1Gi 起跳

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=Dockerfile.cloudrun
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${COMMIT_SHA}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:latest
      - .

  - id: push-sha
    name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${COMMIT_SHA}']
  - id: push-latest
    name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:latest']

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${COMMIT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --quiet

substitutions:
  _REGION: asia-east1
  _SERVICE: job-digger
  _AR_REPO: cloud-run-source-deploy

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${COMMIT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  # Playwright + Chromium build 吃 CPU,給大機器
  machineType: E2_HIGHCPU_8
